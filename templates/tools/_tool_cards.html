{% for tool in tools %}<article class="tool-card" data-tool-slug="{{ tool.slug }}"><div class="tool-card-top"><a class="tool-icon" href="/tools/{{ tool.slug }}/" tabindex="-1" aria-hidden="true"><i data-lucide="{{ tool.icon|default:'wrench' }}"></i></a><button type="button" class="favorite-button" data-favorite="{{ tool.slug }}" aria-label="Add {{ tool.name }} to favorites" aria-pressed="false"><i data-lucide="star"></i></button></div><a href="/tools/{{ tool.slug }}/" class="tool-card-link"><h3>{{ tool.name }}</h3><p>{{ tool.description }}</p><span class="tool-card-bottom"><span>{{ tool.category_name|default:tool.category|title }}</span><i data-lucide="arrow-up-right"></i></span></a></article>{% empty %}<div class="empty-state"><i data-lucide="search-x"></i><h3>No tools found</h3><p>Try a different keyword or explore another category.</p><a href="/tools/" class="text-link">Browse all tools <i data-lucide="arrow-right"></i></a></div>{% endfor %}
